name: 🔒 Security Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          check-latest: true
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify security lint detects unsafe code
        run: npm run test:lint-security
      - name: Security lint
        run: npm run lint:security -- --format json --output-file eslint-report.json
      - name: Security regression tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          npm run test:security 2>&1 | tee security-test-report.txt
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          npm run audit:dependencies 2>&1 | tee audit-report.txt
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            eslint-report.json
            audit-report.txt
            security-test-report.txt
          retention-days: 30

  quality-gate:
    name: Security Quality Gate
    runs-on: ubuntu-latest
    needs: [security-audit]
    if: always()
    steps:
      - name: Require successful security audit
        env:
          AUDIT_RESULT: ${{ needs.security-audit.result }}
        run: |
          if [ "$AUDIT_RESULT" != success ]; then
            echo "Security audit did not pass: $AUDIT_RESULT"
            exit 1
          fi
