name: CI/CD - Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # ESLint 10 requires Node 22.13+ or 24+. Test both supported
        # LTS lines on Linux and the minimum line on other platforms.
        include:
          - os: ubuntu-latest
            node-version: 24.x
          - os: ubuntu-latest
            node-version: 22.x
          - os: windows-latest
            node-version: 22.x
          - os: macos-latest
            node-version: 22.x

    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        check-latest: true
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build web app (Vite)
      run: npm run build

    - name: Run tests
      run: npm run test:run

    - name: Type check
      run: npx tsc --noEmit

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      if: runner.os == 'Linux' && matrix.node-version == '22.x'
      with:
        name: build-artifacts
        path: dist/
        retention-days: 5

  browser-smoke:
    name: Production browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
